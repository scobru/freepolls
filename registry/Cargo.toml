[package]
name = "freepolls-registry"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
whoiam-delegation = { git = "https://github.com/scobru/freenames", rev = "d6dc35f8d0d85c0d95430c5da3c3eeb8e9ee9120" } # the poll owner is a whoiam persona
freenet-stdlib = { version = "0.8", features = ["contract"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", default-features = false }
hex = "0.4"
sha2 = { version = "0.10", default-features = false }

[features]
default = ["freenet-main-contract"]
freenet-main-contract = []
